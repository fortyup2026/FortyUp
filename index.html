<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortyUp X</title>

<style>
:root{
 --bg:#0b0f1a;
 --card:#121826;
 --accent:#00e0ff;
 --accent2:#22c55e;
 --text:#fff;
 --muted:#8aa0b8;
}

*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}

.screen{display:none;padding:16px}
.screen.active{display:block}

input,textarea{
 width:100%;
 padding:12px;
 border-radius:12px;
 border:none;
 margin:6px 0;
 background:#1c2333;
 color:white;
}

button{
 border:none;
 padding:12px;
 border-radius:30px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:white;
 font-weight:bold;
 cursor:pointer;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px;
}

.diamond{
 font-size:14px;
 background:#1c2333;
 padding:6px 12px;
 border-radius:20px;
}

.swipe{
 height:450px;
 position:relative;
 overflow:hidden;
}

.card{
 position:absolute;
 width:100%;
 height:100%;
 border-radius:24px;
 background:var(--card);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 font-size:24px;
 text-align:center;
 transition:.3s;
}

.nav{
 position:fixed;
 bottom:0;
 width:100%;
 display:flex;
 justify-content:space-around;
 background:#020617;
 padding:10px 0;
}

.nav button{
 background:none;
 color:white;
 font-size:20px;
}

.event{
 background:var(--card);
 padding:14px;
 border-radius:18px;
 margin-top:10px;
}

</style>
</head>

<body>

<div id="landing" class="screen active">
<h1>FortyUp X</h1>
<p>Conectá. Salí. Viví.</p>
<button onclick="openAuth('login')">Entrar</button>
<button onclick="openAuth('register')">Crear cuenta</button>
</div>

<div id="auth" class="screen">
<h2 id="authTitle"></h2>

<div id="loginBox">
<input id="loginEmail" placeholder="Email">
<button onclick="login()">Entrar</button>
</div>

<div id="registerBox">
<input id="regName" placeholder="Nombre">
<input id="regEmail" placeholder="Email">
<input id="regCity" placeholder="Ciudad">
<button onclick="register()">Crear</button>
</div>

<button onclick="go('landing')">Volver</button>
</div>

<div id="home" class="screen">
<div class="topbar">
<h2 id="hello"></h2>
<div id="diamondCount" class="diamond">💎 5</div>
</div>

<div class="swipe" id="swipe"></div>
</div>

<div id="events" class="screen">
<h2>Eventos</h2>
<div id="eventsList"></div>
</div>

<div id="profile" class="screen">
<h2>Perfil</h2>
<div id="profileData"></div>
<button onclick="logout()">Salir</button>
</div>

<div class="nav">
<button onclick="go('home')">🔥</button>
<button onclick="go('events')">📅</button>
<button onclick="go('profile')">👤</button>
</div>

<script>
const $=id=>document.getElementById(id)

function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}

function go(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'))
 $(id).classList.add('active')
}

function openAuth(mode){
 go('auth')
 authTitle.innerText = mode==='login'?'Entrar':'Crear cuenta'
 loginBox.style.display = mode==='login'?'block':'none'
 registerBox.style.display = mode==='register'?'block':'none'
}

function setUser(u){
 save("user",u)
 let users=load("users",[])
 users=users.filter(x=>x.email!==u.email)
 users.unshift(u)
 save("users",users)
}

function login(){
 const email=loginEmail.value.trim().toLowerCase()
 if(!email) return alert("Email requerido")

 let users=load("users",[])
 let u=users.find(x=>x.email===email)

 if(!u) return alert("No existe")

 setUser(u)
 init()
}

function register(){
 const u={
  name:regName.value,
  email:regEmail.value.toLowerCase(),
  city:regCity.value
 }

 if(!u.name||!u.email||!u.city) return alert("Completar")

 setUser(u)
 init()
}

function logout(){
 localStorage.clear()
 location.reload()
}

function init(){
 const u=load("user")
 hello.innerText="Hola "+u.name
 profileData.innerText=u.name+" - "+u.city
 go('home')
 renderCards()
 renderEvents()
 updateDiamonds()
}

function updateDiamonds(){
 let d=load("diamonds",5)
 diamondCount.innerText="💎 "+d
}

function renderCards(){
 const users=load("users",[])
 const me=load("user")
 const others=users.filter(u=>u.email!==me.email)

 swipe.innerHTML=""

 others.forEach((u,i)=>{
  const card=document.createElement("div")
  card.className="card"
  card.style.zIndex=100-i
  card.innerHTML="<b>"+u.name+"</b><br>"+u.city

  let start=0
  card.onmousedown=e=>start=e.clientX
  card.onmouseup=e=>{
    if(e.clientX-start>100){
      sendDiamond(u)
      card.remove()
    }else if(start-e.clientX>100){
      card.remove()
    }
  }

  swipe.appendChild(card)
 })
}

function sendDiamond(u){
 let d=load("diamonds",5)
 if(d<=0) return alert("Sin diamantes")
 d--
 save("diamonds",d)
 updateDiamonds()
 alert("💎 enviado a "+u.name)
}

function renderEvents(){
 const ev=[
  "After Office Palermo",
  "Cena Social",
  "Fiesta Electrónica",
  "Meetup Networking"
 ]

 eventsList.innerHTML=ev.map(e=>`<div class="event">${e}</div>`).join("")
}

window.onload=()=>{
 if(load("user")) init()
}
</script>

</body>
</html>
