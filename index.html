<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortyUp Popup +40</title>

<style>
body{margin:0;font-family:Arial}

/* POPUP */
.popup-edad{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup-contenido{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
}

.popup-contenido h2{
  margin-bottom:20px;
  font-family: 'Playfair Display', serif;
  color:#064E3B;
}

.popup-contenido button{
  background:#064E3B;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2 style="text-align:center;margin-top:40px">FortyUp App</h2>

<!-- POPUP -->
<div id="popupEdad" class="popup-edad">
  <div class="popup-contenido">
    <h2>+40 Only</h2>
    <button onclick="aceptarEdad()">Aceptar</button>
  </div>
</div>

<script>
function aceptarEdad(){
  document.getElementById("popupEdad").style.display = "none";
}

window.addEventListener("load", function(){
  setTimeout(()=>{
    document.getElementById("popupEdad").style.display = "flex";
  }, 300);
});
</script>

</body>
</html>
