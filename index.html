<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FortyUp Clean Full</title>
<style>
body{font-family:sans-serif;margin:0;background:#0f172a;color:white}
.screen{display:none;padding:20px}
.screen.active{display:block}
button{padding:10px;border-radius:20px;border:none;background:#22c55e;color:white;font-weight:bold}
input{padding:10px;margin:5px;border-radius:10px;border:none}
.card{background:#1e293b;padding:15px;border-radius:20px;margin:10px 0}
</style>
</head>
<body>

<div id="landing" class="screen active">
<h1>FortyUp</h1>
<button onclick="openAuth('log')">Iniciar sesión</button>
<button onclick="openAuth('reg')">Crear perfil</button>
</div>

<div id="auth" class="screen">
<h2 id="authTitle"></h2>

<div id="loginBox">
<input id="lEmail" placeholder="Email">
<button onclick="login()">Ingresar</button>
</div>

<div id="registerBox">
<input id="rName" placeholder="Nombre">
<input id="rEmail" placeholder="Email">
<input id="rCity" placeholder="Ciudad">
<button onclick="register()">Crear perfil</button>
</div>

<button onclick="go('landing')">Volver</button>
</div>

<div id="home" class="screen">
<h2 id="welcome"></h2>
<button onclick="go('profiles')">Ver perfiles</button>
<button onclick="logout()">Cerrar sesión</button>
</div>

<div id="profiles" class="screen">
<h2>Perfiles</h2>
<div id="profilesList"></div>
<button onclick="go('home')">Volver</button>
</div>

<script>
function go(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'))
 document.getElementById(id).classList.add('active')
}

function openAuth(mode){
 go('auth')
 if(mode==='log'){
  document.getElementById('authTitle').innerText='Iniciar sesión'
  loginBox.style.display='block'
  registerBox.style.display='none'
 }else{
  document.getElementById('authTitle').innerText='Crear perfil'
  loginBox.style.display='none'
  registerBox.style.display='block'
 }
}

function saveUser(u){
 localStorage.setItem("fu_user", JSON.stringify(u))
}

function getUser(){
 return JSON.parse(localStorage.getItem("fu_user")||"null")
}

function login(){
 const email=lEmail.value.trim().toLowerCase()
 if(!email) return alert("Ingresá email")
 let users=JSON.parse(localStorage.getItem("fu_users")||"[]")
 let user=users.find(u=>u.email===email)
 if(!user){
  user={id:email,name:email.split("@")[0],email,city:"Buenos Aires"}
 }
 saveUser(user)
 goHome()
}

function register(){
 const name=rName.value.trim()
 const email=rEmail.value.trim().toLowerCase()
 const city=rCity.value.trim()
 if(!name||!email||!city) return alert("Completá todo")

 const user={id:email,name,email,city}
 let users=JSON.parse(localStorage.getItem("fu_users")||"[]")
 users=users.filter(u=>u.email!==email)
 users.unshift(user)
 localStorage.setItem("fu_users",JSON.stringify(users))

 saveUser(user)
 goHome()
}

function logout(){
 localStorage.removeItem("fu_user")
 go('landing')
}

function goHome(){
 const u=getUser()
 welcome.innerText="Bienvenido "+u.name
 go('home')
 renderProfiles()
}

function renderProfiles(){
 let users=JSON.parse(localStorage.getItem("fu_users")||"[]")
 const me=getUser()
 users=users.filter(u=>u.email!==me.email)

 profilesList.innerHTML=users.map(u=>`
  <div class="card">
   <b>${u.name}</b><br>
   ${u.city}
  </div>
 `).join("") || "<p>No hay usuarios aún</p>"
}

window.onload=()=>{
 if(getUser()) goHome()
}
</script>

</body>
</html>
