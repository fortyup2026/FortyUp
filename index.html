<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FortyUp v11</title>

<style>
body{font-family:Arial;margin:0;background:#f2f2f2;}
.header{background:#064E3B;color:white;padding:10px;display:flex;justify-content:space-between;align-items:center;}
.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#ccc;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.card{background:white;border-radius:10px;overflow:hidden;border:2px solid transparent;}
.card.me{border:2px solid gold;}
.card img{width:100%;height:160px;object-fit:cover;}
.name{padding:5px;font-weight:bold;}
.forti{margin:5px;padding:6px;border-radius:20px;border:1px solid #ccc;text-align:center;cursor:pointer;}
.plus{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:#064E3B;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;}
.popup{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:white;padding:20px;border-radius:10px;display:none;}
</style>
</head>

<body>

<div class="header">
  <div>FortyUp 💎</div>
  <div class="avatar" id="avatar"></div>
</div>

<div class="grid" id="profiles"></div>

<div class="plus" onclick="handlePlus()">+</div>

<div class="popup" id="popup"></div>

<script>

function getUsers(){return JSON.parse(localStorage.getItem("fu_users")||"[]");}
function saveUsers(u){localStorage.setItem("fu_users",JSON.stringify(u));}
function getSession(){return JSON.parse(localStorage.getItem("fu_session")||"null");}
function setSession(u){localStorage.setItem("fu_session",JSON.stringify(u));}

function handlePlus(){
  let s=getSession();
  if(!s){
    let name=prompt("Nombre:");
    let photo=prompt("URL de foto (opcional):");
    if(!name)return;
    let users=getUsers();
    let user={id:Date.now(),name:name,photo:photo||"https://picsum.photos/200?"+Math.random(),fortis:{}};
    users.push(user);
    saveUsers(users);
    setSession(user);
    showPopup("💎 Bienvenido "+name);
    render();
  }else{
    showPopup("Ya estás logueado");
  }
}

function render(){
  let users=getUsers();
  let me=getSession();
  let grid=document.getElementById("profiles");
  let avatar=document.getElementById("avatar");
  grid.innerHTML="";
  if(me&&me.photo){avatar.innerHTML="<img src='"+me.photo+"'>";}
  users.forEach(u=>{
    let div=document.createElement("div");
    div.className="card";
    if(me&&u.id===me.id){div.classList.add("me");}
    div.innerHTML=`<img src="${u.photo}">
      <div class="name">${u.name}</div>
      <div class="forti" onclick="sendForti(${u.id})">🔶 Forti</div>`;
    grid.appendChild(div);
  });
}

function sendForti(id){
  let users=getUsers();
  let me=getSession();
  if(!me)return;
  let target=users.find(u=>u.id===id);
  if(!target)return;
  if(!me.fortis)me.fortis={};
  if(me.fortis[id]){showPopup("Ya enviaste Forti");return;}
  me.fortis[id]=true;
  showPopup("🔶 Forti enviado");
  saveUsers(users);
}

function showPopup(text){
  let p=document.getElementById("popup");
  p.innerHTML=text;
  p.style.display="block";
  setTimeout(()=>{p.style.display="none";},2000);
}

render();

</script>

</body>
</html>
