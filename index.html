<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FortyUp PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white}
.screen{display:none;padding:16px}
.screen.active{display:block}
.btn{padding:10px 14px;border:none;border-radius:20px;background:#22c55e;color:white;font-weight:bold}
.input{padding:10px;border-radius:10px;border:none;margin:6px 0;width:100%}
.card{
 background:#1e293b;
 border-radius:20px;
 padding:16px;
 margin-top:10px;
 transition:0.3s;
}
.swipe{
 position:relative;
 width:100%;
 height:300px;
 overflow:hidden;
}
.swipe-card{
 position:absolute;
 width:100%;
 height:100%;
 background:#1e293b;
 border-radius:20px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
}
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.badge{
 background:#22c55e;
 padding:4px 10px;
 border-radius:20px;
 font-size:12px;
}
</style>
</head>
<body>

<div id="landing" class="screen active">
<h1>FortyUp</h1>
<button class="btn" onclick="openAuth('log')">Iniciar sesión</button>
<button class="btn" onclick="openAuth('reg')">Crear perfil</button>
</div>

<div id="auth" class="screen">
<h2 id="authTitle"></h2>

<div id="loginBox">
<input id="lEmail" class="input" placeholder="Email">
<button class="btn" onclick="login()">Ingresar</button>
</div>

<div id="registerBox">
<input id="rName" class="input" placeholder="Nombre">
<input id="rEmail" class="input" placeholder="Email">
<input id="rCity" class="input" placeholder="Ciudad">
<button class="btn" onclick="register()">Crear perfil</button>
</div>

<button onclick="go('landing')">Volver</button>
</div>

<div id="home" class="screen">
<div class="topbar">
<h2 id="welcome"></h2>
<span id="diamonds" class="badge">💎 5</span>
</div>

<div class="swipe" id="swipeArea"></div>

<button class="btn" onclick="go('events')">Eventos</button>
<button class="btn" onclick="logout()">Cerrar sesión</button>
</div>

<div id="events" class="screen">
<h2>Eventos</h2>
<div id="eventsList"></div>
<button onclick="go('home')">Volver</button>
</div>

<script>
function go(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'))
 document.getElementById(id).classList.add('active')
}

function openAuth(mode){
 go('auth')
 authTitle.innerText = mode==='log'?'Iniciar sesión':'Crear perfil'
 loginBox.style.display = mode==='log'?'block':'none'
 registerBox.style.display = mode==='reg'?'block':'none'
}

function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}

function setUser(u){
 save("user",u)
 let users = load("users",[])
 users = users.filter(x=>x.email!==u.email)
 users.unshift(u)
 save("users",users)
}

function login(){
 const email = lEmail.value.trim().toLowerCase()
 if(!email) return alert("Ingresá email")

 let users = load("users",[])
 let u = users.find(x => x.email?.toLowerCase()===email)

 if(!u) return alert("Usuario no existe")

 setUser(u)
 initApp()
}

function register(){
 const name=rName.value.trim()
 const email=rEmail.value.trim().toLowerCase()
 const city=rCity.value.trim()
 if(!name||!email||!city) return alert("Completá todo")

 const u={name,email,city}
 setUser(u)
 initApp()
}

function logout(){
 localStorage.removeItem("user")
 go('landing')
}

function initApp(){
 const u=load("user",null)
 welcome.innerText="Hola "+u.name
 go('home')
 renderSwipe()
 renderEvents()
}

function renderSwipe(){
 const users=load("users",[])
 const me=load("user",{})
 const others=users.filter(u=>u.email!==me.email)

 swipeArea.innerHTML=""

 others.forEach((u,i)=>{
  const card=document.createElement("div")
  card.className="swipe-card"
  card.style.zIndex=100-i
  card.innerText=u.name+" - "+u.city

  let startX=0
  card.onmousedown=e=>startX=e.clientX
  card.onmouseup=e=>{
    if(e.clientX-startX>100){
      sendDiamond(u)
      card.remove()
    }else if(startX-e.clientX>100){
      card.remove()
    }
  }

  swipeArea.appendChild(card)
 })
}

function sendDiamond(u){
 let d = load("diamonds",5)
 if(d<=0) return alert("No tenés diamantes")

 d--
 save("diamonds",d)
 diamonds.innerText="💎 "+d

 alert("Le enviaste un diamante a "+u.name)
}

function renderEvents(){
 const events=[
  {title:"Recital en Palermo"},
  {title:"Cena grupal"},
  {title:"Salida boliche"}
 ]

 eventsList.innerHTML = events.map(e=>`
  <div class="card">${e.title}</div>
 `).join("")
}

window.onload=()=>{
 const u=load("user",null)
 if(u) initApp()
}
</script>

</body>
</html>
