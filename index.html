<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortyUp FINAL Sebas</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#064E3B;color:white;padding:10px}
.btn{padding:8px 12px;border-radius:10px;background:#059669;color:white;border:none}
</style>
</head>
<body>

<h2 style="text-align:center;margin-top:40px">FortyUp FINAL</h2>

<div class="nav">
<button id="home">Inicio</button>
<button id="profiles">Perfiles</button>
<button id="plus">Unirme</button>
<button id="chats">Mensajes</button>
<button id="profile">Perfil</button>
</div>

<script>
let logged=false;

function updateUI(){
document.getElementById("chats").style.display = logged ? "block":"none";
document.getElementById("profile").style.display = logged ? "block":"none";

let plus=document.getElementById("plus");
if(logged){
plus.innerText="Perfil";
plus.onclick=()=>alert("Ir a perfil");
}else{
plus.innerText="Unirme";
plus.onclick=()=>alert("Registro");
}
}

updateUI();

// popup +40
window.onload=()=>{
if(!localStorage.getItem("ageOK")){
let p=document.createElement("div");
p.style="position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:white;display:flex;align-items:center;justify-content:center;z-index:9999";
p.innerHTML='<div><h2>+40 Only</h2><button onclick="acceptAge()">Aceptar</button></div>';
document.body.appendChild(p);
}
}

function acceptAge(){
localStorage.setItem("ageOK","1");
location.reload();
}

// forti
function sendForti(btn){
btn.innerText="Enviado 💛";
}

// lluvia
function rain(){
for(let i=0;i<20;i++){
let d=document.createElement("div");
d.innerText="💎";
d.style=`position:fixed;top:-20px;left:${Math.random()*100}%;animation:fall 3s linear`;
document.body.appendChild(d);
setTimeout(()=>d.remove(),3000);
}
}

let style=document.createElement("style");
style.innerHTML="@keyframes fall{to{transform:translateY(100vh)}}";
document.head.appendChild(style);
</script>

</body>
</html>
