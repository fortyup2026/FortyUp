<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortyUp FIX FINAL</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;padding-bottom:80px}
header{padding:15px;background:#064E3B;color:#fff}
.container{padding:15px}
.card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
button{padding:8px;border:none;border-radius:8px;background:#10B981;color:#fff;margin-top:5px}
.yellow{background:#F2B705;color:#000;width:100%;padding:12px;font-weight:bold}
.bottom{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ccc}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#0006;display:none;justify-content:center;align-items:center}
.modal-content{background:#fff;padding:15px;border-radius:10px;width:90%;max-height:80%;overflow:auto}
.close{float:right;font-weight:bold;cursor:pointer}
.save-btn{position:sticky;bottom:0;background:#10B981;color:#fff;width:100%;padding:12px}
</style>
</head>

<body>

<header>FortyUp</header>

<div class="container">

<button class="yellow" onclick="crearEvento()">Crear evento público</button>

<div id="eventos"></div>

</div>

<div id="modal" class="modal">
<div class="modal-content">
<span class="close" onclick="cerrarModal()">✕</span>
<div id="detalle"></div>
</div>
</div>

<div class="bottom">
<div>Inicio</div>
<div>Planes</div>
<div>Perfil</div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDJbA3lzwsEDolwjiF0WulYIbp-p8pcXAY",
authDomain: "fortyup-9dfe7.firebaseapp.com",
projectId: "fortyup-9dfe7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let user="demo";

function crearEvento(){
let n=prompt("Evento");
let f=prompt("Fecha YYYY-MM-DD");
let h=prompt("Hora HH:MM");

db.collection("eventos").add({
nombre:n,fecha:f,hora:h,creador:user
});
}

function cargar(){
db.collection("eventos").onSnapshot(snap=>{
let html="";
snap.forEach(doc=>{
let e=doc.data();

let now = new Date();
let evDate = new Date(e.fecha+"T"+e.hora);

if(evDate < now){
db.collection("eventos").doc(doc.id).delete();
return;
}

html+=`
<div class="card" onclick="abrir('${doc.id}','${e.nombre}','${e.fecha}','${e.hora}')">
<b>${e.nombre}</b><br>
${e.fecha} ${e.hora}
</div>
`;
});
document.getElementById("eventos").innerHTML=html;
});
}

function abrir(id,n,f,h){
document.getElementById("detalle").innerHTML=`
<h3>${n}</h3>
<p>${f} ${h}</p>
<button onclick="asistir('${id}')">Asistiré</button>
`;
document.getElementById("modal").style.display="flex";
}

function cerrarModal(){
document.getElementById("modal").style.display="none";
}

function asistir(id){
alert("Te uniste al evento");

db.collection("notificaciones").add({
texto:"Alguien se unió a tu evento",
fecha:Date.now()
});
}

cargar();
</script>

</body>
</html>
